server.port=8082
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=collabpulse_chat
spring.data.mongodb.uri=mongodb://localhost:27017/collabpulse_chat
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ Bağlantı Ayarları
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}