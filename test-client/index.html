<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>CollabPulse - Chat Test Client</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; }
  fieldset { margin-bottom: 16px; }
  label { display: inline-block; width: 90px; }
  input { padding: 4px; margin-bottom: 6px; }
  button { padding: 6px 14px; cursor: pointer; }
  #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; background: #f8f8f8; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  .status-ok { color: green; }
  .status-err { color: red; }
</style>
</head>
<body>
<h2>CollabPulse Chat - Test Client</h2>

<fieldset>
  <legend>1. Bağlan</legend>
  <label>Kendi ID'm:</label>
  <input id="myUserId" value="1" size="5">
  <button id="connectBtn" onclick="connect()">Bağlan</button>
  <button id="disconnectBtn" onclick="disconnect()" disabled>Bağlantıyı Kes</button>
  <div id="connStatus">Bağlı değil</div>
</fieldset>

<fieldset>
  <legend>2. Mesaj Gönder</legend>
  <label>Alıcı ID:</label>
  <input id="receiverId" value="2" size="5"><br>
  <label>Mesaj:</label>
  <input id="content" value="Merhaba!" size="40"><br>
  <button id="sendBtn" onclick="sendMessage()" disabled>Gönder</button>
</fieldset>

<fieldset>
  <legend>3. Log</legend>
  <div id="log"></div>
</fieldset>

<script>
  const CHAT_SERVICE_WS = "http://localhost:8082/ws-connect";
  let stompClient = null;

  function log(msg, cls) {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    if (cls) line.className = cls;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function connect() {
    const userId = document.getElementById('myUserId').value.trim();
    if (!userId) { alert("Kullanıcı ID gerekli"); return; }

    const socket = new SockJS(CHAT_SERVICE_WS + "?userId=" + encodeURIComponent(userId));
    stompClient = Stomp.over(socket);
    stompClient.debug = null; // konsolu spam etmesin

    log(`Bağlanılıyor... (userId=${userId})`);

    stompClient.connect({}, function (frame) {
      log("Bağlantı başarılı: " + frame, "status-ok");
      document.getElementById('connStatus').innerHTML = '<span class="status-ok">Bağlı (userId=' + userId + ')</span>';
      document.getElementById('connectBtn').disabled = true;
      document.getElementById('disconnectBtn').disabled = false;
      document.getElementById('sendBtn').disabled = false;

      stompClient.subscribe('/user/queue/messages', function (message) {
        const body = JSON.parse(message.body);
        log("MESAJ ALINDI: " + JSON.stringify(body), "status-ok");
      });
    }, function (error) {
      log("Bağlantı hatası: " + error, "status-err");
      document.getElementById('connStatus').innerHTML = '<span class="status-err">Bağlantı hatası</span>';
    });
  }

  function disconnect() {
    if (stompClient !== null) {
      stompClient.disconnect(function () {
        log("Bağlantı kesildi.");
      });
    }
    document.getElementById('connStatus').textContent = 'Bağlı değil';
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('disconnectBtn').disabled = true;
    document.getElementById('sendBtn').disabled = true;
  }

  function sendMessage() {
    const senderId = document.getElementById('myUserId').value.trim();
    const receiverId = document.getElementById('receiverId').value.trim();
    const content = document.getElementById('content').value;

    const payload = {
      senderId: Number(senderId),
      receiverId: Number(receiverId),
      content: content
    };

    stompClient.send("/app/chat.send", {}, JSON.stringify(payload));
    log("MESAJ GÖNDERİLDİ: " + JSON.stringify(payload));
  }
</script>
</body>
</html>
